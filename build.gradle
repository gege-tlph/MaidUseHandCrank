plugins {
    id 'fabric-loom' version '1.17.14'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    // TLM-Tsumugi 本地 jar
    flatDir {
        dir "libs"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Cloth Config
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        // Forge Config API Port
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create-Fly（必需）
    modImplementation "maven.modrinth:create-fly:${create_fly_version}"

    // Touhou Little Maid: Tsumugi（必需，libs/ flatDir）
    modCompileOnly "libs:touhoulittlemaid-fabric:${tlm_version}"
    modLocalRuntime "libs:touhoulittlemaid-fabric:${tlm_version}"

    // Forge Config API Port：提供 ModConfigSpec / ModConfig（必需）
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Cloth Config（软依赖：TLM 配置界面集成）
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    // ModMenu（软依赖：mod 列表里的配置入口）
    modCompileOnly "maven.modrinth:modmenu:${modmenu_version}@jar"
    modLocalRuntime "maven.modrinth:modmenu:${modmenu_version}@jar"

    // javax.annotation.Nonnull / Nullable
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

remapJar {
    archiveFileName = "${mod_name}_${mod_version}-fabric-${minecraft_version}.jar"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
