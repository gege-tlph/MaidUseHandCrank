name: Build

# 构建校验：产物为 Fabric 1.21.11 的可安装 JAR。
# TLM-Tsumugi 以 libs/ 下的本地 jar（flatDir）参与编译，已随仓库跟踪，故 CI 无需额外凭据。
on:
  push:
    branches: [ "1.21.11" ]
  pull_request:
    branches: [ "1.21.11" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # 把产物哈希打进日志，便于与发布页公布的 SHA-256 对账
      - name: Checksums
        run: sha256sum build/libs/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MaidUseHandCrank-fabric-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
